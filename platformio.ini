[platformio]
default_envs = stm32f107custom
src_dir = .

[env:stm32f107custom_base]
platform = ststm32
board = genericSTM32F107VC
framework = stm32cube

build_type = debug
debug_tool = stlink
upload_protocol = stlink
debug_init_break = break loop

lib_deps =
  lvgl/lvgl@^8.3.11

build_src_filter =
  +<src/>
  -<.git>
  -<.vscode>
  -<.pio>
  -<.pio_tmp>
  -<docs>
  -<scripts>
  -<test>
  -<examples>

build_unflags =
    -std=gnu++11

build_flags =
  -std=gnu++17
  -std=gnu11
  -fexceptions
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DDEBUG=1
  -DDEBUG_OUTPUT=DEBUG_OUTPUT_SWD
  ; -DDEBUG_OUTPUT=DEBUG_OUTPUT_NONE
  ; -DDEBUG_OUTPUT=DEBUG_OUTPUT_USB
  -DTFT_DRIVER=TFT_DRIVER_ST7789
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -Og
  -g3

[env:stm32f107custom_usb]
extends = env:stm32f107custom_base

build_src_filter = ${env:stm32f107custom_base.build_src_filter}
  +<cubemx/USB_DEVICE/App/>
  +<cubemx/USB_DEVICE/Target/usbd_conf.c>
  +<cubemx/Middlewares/ST/STM32_USB_Device_Library/Core/Src/usbd_core.c>
  +<cubemx/Middlewares/ST/STM32_USB_Device_Library/Core/Src/usbd_ctlreq.c>
  +<cubemx/Middlewares/ST/STM32_USB_Device_Library/Core/Src/usbd_ioreq.c>
  +<cubemx/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Src/usbd_cdc.c>

build_flags =
  ${env:stm32f107custom_base.build_flags}
  -DHAVE_USB_DEVICE=1
  -I cubemx/Core/Inc
  -I cubemx/USB_DEVICE/App
  -I cubemx/USB_DEVICE/Target
  -I cubemx/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I cubemx/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc

[env:stm32f107custom]
extends = env:stm32f107custom_base
